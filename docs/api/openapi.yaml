openapi: 3.1.0
info:
  title: InfoMemory Agent API
  version: 0.3.0
  description: >-
    Security-first enterprise memory API. Production requests use a signed Bearer
    token. The x-tenant-id/x-user-id development identity is forbidden in production.
servers:
  - url: http://127.0.0.1:3000
    description: Local development
security:
  - bearerAuth: []
  - trustedTenantHeader: []
    trustedUserHeader: []
tags:
  - name: Health
  - name: Assets
  - name: Retrieval
  - name: Reminders
  - name: Connectors
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Database is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Compatibility health response; production omits capability details
  /openapi.yaml:
    get:
      tags: [Health]
      operationId: getOpenApiDocument
      security: []
      responses:
        "200":
          description: This OpenAPI document
          content:
            application/yaml:
              schema: { type: string }
  /v1/assets:
    post:
      tags: [Assets]
      operationId: ingestAsset
      parameters:
        - name: idempotency-key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestAsset" }
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetIngestResult" }
        "200":
          description: Idempotent or content duplicate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetIngestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Assets]
      operationId: listAssets
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2000 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000 } }
        - { name: visibility, in: query, schema: { $ref: "#/components/schemas/AssetVisibility" } }
        - { name: sourceType, in: query, schema: { $ref: "#/components/schemas/SourceType" } }
        - { name: createdAfter, in: query, schema: { type: string, format: date-time } }
        - { name: createdBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Permission-filtered page
          content:
            application/json:
              schema:
                type: object
                required: [assets]
                properties:
                  assets:
                    type: array
                    items: { $ref: "#/components/schemas/InformationAsset" }
                  nextCursor: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/assets/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Assets]
      operationId: getAsset
      responses:
        "200":
          description: Accessible asset
          content:
            application/json:
              schema:
                type: object
                required: [asset]
                properties:
                  asset: { $ref: "#/components/schemas/InformationAsset" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Assets]
      operationId: deleteOwnedAsset
      responses:
        "200":
          description: Asset and derived SQLite index records deleted by its owner
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/search:
    post:
      tags: [Retrieval]
      operationId: searchEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Query" }
      responses:
        "200":
          description: Permission-filtered FTS5 evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/answers:
    post:
      tags: [Retrieval]
      operationId: answerWithEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Query" }
      responses:
        "200":
          description: Grounded answer or explicit evidence-only degradation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnswerResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/reminders:
    post:
      tags: [Reminders]
      operationId: createReminder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReminder" }
      responses:
        "201":
          description: Private reminder created
          content:
            application/json:
              schema:
                type: object
                required: [reminder]
                properties:
                  reminder: { $ref: "#/components/schemas/Reminder" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [Reminders]
      operationId: listReminders
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: status, in: query, description: Comma-separated statuses, schema: { type: string } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Current user's reminders
  /v1/reminders/due:
    get:
      tags: [Reminders]
      operationId: listDueReminders
      parameters:
        - { name: at, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Confirmed reminders due at or before the selected time }
  /v1/reminders/{id}:
    delete:
      tags: [Reminders]
      operationId: deleteReminder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        "200":
          description: Reminder deleted by its owner
          content:
            application/json:
              schema:
                type: object
                required: [deleted, id]
                properties:
                  deleted: { type: boolean, const: true }
                  id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/reminders/{id}/status:
    post:
      tags: [Reminders]
      operationId: updateReminderStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/ReminderStatus" }
      responses:
        "200": { description: Reminder status updated }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/connectors/feishu/events:
    post:
      tags: [Connectors]
      operationId: receiveFeishuEvent
      security: []
      description: >-
        Feishu webhook. When FEISHU_ENCRYPT_KEY is configured, the payload must be
        encrypted and signed with fresh X-Lark-Request-* headers.
      parameters:
        - { name: X-Lark-Request-Timestamp, in: header, schema: { type: string } }
        - { name: X-Lark-Request-Nonce, in: header, schema: { type: string } }
        - { name: X-Lark-Signature, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Challenge, synchronous acknowledgement, or asynchronous queue acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuEventResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/admin/connectors/queue:
    get:
      tags: [Connectors]
      operationId: getConnectorQueueStats
      description: >-
        Tenant-scoped operational queue statistics. Payloads and error details
        are intentionally never returned. Requires connector:queue:read or an
        administrator role.
      parameters:
        - name: connector
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Inbox/outbox counts and oldest pending timestamps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorQueueStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/admin/connectors/queue/inbox/{id}/retry:
    post:
      tags: [Connectors]
      operationId: retryConnectorInbox
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Inbox row requeued }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/connectors/queue/outbox/{id}/retry:
    post:
      tags: [Connectors]
      operationId: retryConnectorOutbox
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Outbox row requeued }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/connectors/queue/inbox/{id}/cancel:
    post:
      tags: [Connectors]
      operationId: cancelConnectorInbox
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Inbox row moved to dead letter }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/connectors/queue/outbox/{id}/cancel:
    post:
      tags: [Connectors]
      operationId: cancelConnectorOutbox
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Outbox row moved to dead letter }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/connectors/feishu/oauth/start:
    get:
      tags: [Connectors]
      operationId: startFeishuOAuth
      description: >-
        Creates a short-lived, one-time CSRF state and returns the Feishu
        authorization URL. Requires a tenant administrator permission.
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Local application path to display after installation; external URLs are rejected.
          schema: { type: string, maxLength: 500, pattern: '^/(?!/)' }
      responses:
        "200":
          description: Authorization URL; the state value is never persisted in plaintext.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuOAuthStart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/connectors/feishu/oauth/callback:
    get:
      tags: [Connectors]
      operationId: completeFeishuOAuth
      security: []
      description: >-
        Public OAuth callback. The one-time state is atomically consumed before
        code exchange; access and refresh tokens are encrypted at rest and never
        returned to the caller.
      parameters:
        - { name: code, in: query, schema: { type: string, maxLength: 4000 } }
        - { name: state, in: query, schema: { type: string, maxLength: 512 } }
        - { name: error, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Installation metadata without credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuOAuthCallback" }
        "303":
          description: >-
            Browser flow redirected to the validated first-party returnTo path;
            successful installs use feishu=connected and provider-denied installs
            use feishu=error. Provider error text and OAuth credentials are never
            reflected in the redirect.
          headers:
            Location:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/connectors/feishu/installation:
    get:
      tags: [Connectors]
      operationId: getFeishuInstallation
      description: Returns current tenant installation metadata; credentials are never exposed.
      responses:
        "200":
          description: Installation metadata
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation: { $ref: "#/components/schemas/FeishuInstallation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Connectors]
      operationId: revokeFeishuInstallation
      description: Revokes the local installation record for the current tenant.
      responses:
        "200":
          description: Installation revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked, tenantId]
                properties:
                  revoked: { type: boolean, const: true }
                  tenantId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/connectors/feishu/installation/refresh:
    post:
      tags: [Connectors]
      operationId: refreshFeishuInstallation
      description: >-
        Rotates the current tenant's access token using its encrypted refresh
        session. Compare-and-set prevents stale concurrent rotations.
      responses:
        "200":
          description: Refreshed installation metadata without credentials
          content:
            application/json:
              schema:
                type: object
                required: [installation]
                properties:
                  installation: { $ref: "#/components/schemas/FeishuInstallation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HS256 JWT
    trustedTenantHeader:
      type: apiKey
      in: header
      name: x-tenant-id
      description: Development/test only; forbidden in production
    trustedUserHeader:
      type: apiKey
      in: header
      name: x-user-id
      description: Development/test only; forbidden in production
  parameters:
    AssetId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated principal lacks permission
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource is absent or hidden by the access context
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Idempotency or state transition conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ServiceUnavailable:
      description: Service is not ready
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/ApiError" }
              - { $ref: "#/components/schemas/Readiness" }
    BadGateway:
      description: Upstream Feishu OAuth provider failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    ApiError:
      type: object
      required: [error, message, requestId]
      properties:
        error: { type: string }
        message: { type: string }
        requestId: { type: string }
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: infomemory-api }
        version: { type: string }
    Readiness:
      type: object
      required: [status, service, checks, requestId]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service: { type: string, const: infomemory-api }
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              enum: [ok, error]
        requestId: { type: string }
    AssetVisibility:
      type: string
      enum: [owner, tenant]
    SourceType:
      type: string
      enum: [manual, local_file, feishu_message, feishu_document]
    SourceReference:
      type: object
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/SourceType" }
        externalId: { type: string }
        url: { type: string, format: uri }
    IngestAsset:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
        visibility: { $ref: "#/components/schemas/AssetVisibility" }
        source: { $ref: "#/components/schemas/SourceReference" }
    InformationAsset:
      type: object
      required: [id, tenantId, ownerId, visibility, title, redactedContent, contentHash, sources, secretFindingCount, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        ownerId: { type: string }
        visibility: { $ref: "#/components/schemas/AssetVisibility" }
        title: { type: string }
        redactedContent: { type: string }
        contentHash: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceReference" }
        secretFindingCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    AssetIngestResult:
      type: object
      required: [asset, created]
      properties:
        asset: { $ref: "#/components/schemas/InformationAsset" }
        created: { type: boolean }
        deduplicatedBy: { type: string, enum: [idempotency, content_hash] }
    Query:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 1000 }
        limit: { type: integer, minimum: 1, maximum: 20, default: 8 }
    SearchEvidence:
      type: object
      required: [citationId, assetId, title, snippet, score, sources, createdAt]
      properties:
        citationId: { type: string }
        assetId: { type: string }
        title: { type: string }
        snippet: { type: string }
        score: { type: number }
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceReference" }
        createdAt: { type: string, format: date-time }
    SearchResult:
      type: object
      required: [mode, query, evidence]
      properties:
        mode: { type: string, const: keyword }
        query: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/SearchEvidence" }
    AnswerResult:
      type: object
      required: [status, answer, evidence]
      properties:
        status: { type: string, enum: [answered, evidence_only, no_evidence] }
        answer: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/SearchEvidence" }
        degradedReason: { type: string, enum: [llm_disabled, llm_error, missing_citations] }
    CreateReminder:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        startsAt: { type: string, format: date-time }
        remindAt: { type: string, format: date-time }
    ReminderStatus:
      type: string
      enum: [scheduled, needs_confirmation, completed, cancelled]
    Reminder:
      type: object
      required: [id, tenantId, userId, title, startsAt, remindAt, status, precision, createdAt]
      properties:
        id: { type: string }
        tenantId: { type: string }
        userId: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        remindAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ReminderStatus" }
        precision: { type: string, enum: [exact, period, inferred] }
        sourceAssetId: { type: string }
        sourceEventId: { type: string }
        createdAt: { type: string, format: date-time }
    FeishuEventResponse:
      description: >-
        Feishu webhook response. URL verification returns a challenge. Synchronous
        events return an acknowledgement; production asynchronous ingress returns
        the durable inbox id and whether the event was newly queued.
      oneOf:
        - type: object
          required: [challenge]
          properties:
            challenge: { type: string }
        - type: object
          required: [code, processed]
          not:
            required: [queued]
          properties:
            code: { type: integer, const: 0 }
            processed: { type: boolean }
            reminder: { $ref: "#/components/schemas/Reminder" }
            notificationSent: { type: boolean, const: true }
            reason:
              type: string
              enum:
                - unsupported_event
                - unsupported_message_type
                - invalid_event_payload
                - duplicate_event
                - duplicate_content
                - command_notifications_unavailable
                - command_delivery_failed
                - notification_target_unavailable
        - type: object
          required: [code, queued, processed, inboxId]
          properties:
            code: { type: integer, const: 0 }
            queued: { type: boolean, const: true }
            processed: { type: boolean, const: false }
            inboxId: { type: string }
        - type: object
          required: [code, queued, processed, inboxId, reason]
          properties:
            code: { type: integer, const: 0 }
            queued: { type: boolean, const: false }
            processed: { type: boolean, const: false }
            inboxId: { type: string }
            reason:
              type: string
              enum: [duplicate_event, queue_conflict]
    FeishuOAuthStart:
      type: object
      required: [authorizationUrl, stateExpiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        stateExpiresAt: { type: string, format: date-time }
    FeishuInstallation:
      type: object
      required: [tenantId, appId, scopes, status, createdAt, updatedAt]
      properties:
        tenantId: { type: string }
        appId: { type: string }
        tenantName: { type: string }
        scopes:
          type: array
          items: { type: string }
        openId: { type: string }
        unionId: { type: string }
        installedByUserId: { type: string }
        status: { type: string, enum: [active, revoked] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshTokenExpiresAt: { type: string, format: date-time }
