name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete quality gate
        run: npm run verify

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Audit locked dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  docker-build:
    name: Linux Docker build and readiness smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build the production image
        run: docker build --tag infomemory-agent:ci .

      - name: Start the production container
        run: |
          docker run --detach --name infomemory-agent-ci \
            --publish 3000:3000 \
            --env AUTH_SECRET=ci-only-secret-with-at-least-32-bytes-long \
            --env AUTH_ISSUER=infomemory-agent-ci \
            --env AUTH_AUDIENCE=infomemory-api \
            infomemory-agent:ci

      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' infomemory-agent-ci 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then
              docker logs infomemory-agent-ci
              exit 1
            fi
            sleep 1
          done
          docker logs infomemory-agent-ci
          exit 1

      - name: Stop the production container
        if: always()
        run: docker rm --force infomemory-agent-ci
